name: Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: minecraft-plugins
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Compilar os plugins
        run: gradle build --no-daemon

      - name: Guardar os .jar
        uses: actions/upload-artifact@v4
        with:
          name: plugins
          path: "minecraft-plugins/*/build/libs/*.jar"
